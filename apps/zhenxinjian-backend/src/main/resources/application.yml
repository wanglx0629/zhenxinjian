# 后端主配置
# 作者: wanglx

spring:
  application:
    name: zhenxinjian-backend
  profiles:
    active: dev
  banner:
    location: classpath:banner.txt
  jackson:
    deserialization:
      # 拒绝未知字段，防止 JSON 反序列化注入额外属性
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

# MyBatis-Plus 全局配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除全局字段（对应列 delete_flag，所有表统一）
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志默认关闭，开发环境在 application-dev.yml 打开

# SpringDoc / Knife4j 配置（入口 /doc.html；api-docs 供文档数据）
springdoc:
  api-docs:
    path: /v3/api-docs

# 自定义配置
zhenxinjian:
  wechat:
    # 三餐提醒订阅消息模板ID（一次性订阅，微信公众平台申请；未配置时推送任务空转）
    remind-template-id: ${WECHAT_REMIND_TEMPLATE_ID:}
    # 订阅消息跳转小程序版本：developer开发版/trial体验版/formal正式版
    remind-miniprogram-state: ${WECHAT_REMIND_MP_STATE:formal}
  jwt:
    # 密钥强制环境变量注入（启动内容门禁：缺失/过短/含弱特征一律拒启；本地开发可写入 gitignored 的 application-dev.yml）
    secret: ${JWT_SECRET:}
    expire-minutes: 120
    refresh-threshold-minutes: 30
  config:
    # SECRET 类配置值（project_config.value_type=5）的 AES 加密密钥：16/24/32 字符，强制环境变量注入
    # 未配置时仅密文类配置不可保存/读取，普通配置不受影响；本地开发默认值见 gitignored 的 application-dev.yml
    aes-key: ${CONFIG_AES_KEY:}
  redis:
    token-prefix: "zhenxinjian:token:"
    captcha-prefix: "zhenxinjian:captcha:"
    login-fail-prefix: "zhenxinjian:login:fail:"
    # 登录试错上限（达到后锁定）
    login-fail-max: 10
    # 失败计数过期时间（分钟）
    login-fail-ttl-minutes: 15
    # 埋点限流计数前缀（维度：登录用户 userId / 未登录 IP）
    track-rate-prefix: "zhenxinjian:track:rate:"
    # 埋点上报限流阈值（批次/分钟/维度；端上正常水位 ≤6，5 倍余量防刷量写库）
    track-rate-limit-per-minute: 30
  cache:
    warmup-enabled: true
    max-value-bytes: 51200
  security:
    permit-urls:
      - /auth/login
      - /auth/captcha
      # 小程序认证（微信登录 / 游客签发）
      - /auth/wechat/login
      - /auth/guest
      # 埋点上报（登录态可选）
      - /track/events
      # Knife4j 文档（dev 基线开箱即通；prod profile 覆盖禁用，见 application-prod.yml）
      - /doc.html
      - /webjars/**
      - /favicon.ico
      - /v3/api-docs/**
    cors-allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
  storage:
    path-prefix: upload/
    max-size-mb: 10
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - pdf
    minio:
      # 默认关闭，本地未启动 MinIO 时不影响应用启动；需要上传时再开启
      enabled: false
      endpoint: http://127.0.0.1:9000
      # 凭据强制环境变量注入（与 JWT_SECRET 同策略；本地开发默认值见 gitignored 的 application-dev.yml）
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: zhenxinjian
    oss:
      enabled: false
      endpoint: oss-cn-hangzhou.aliyuncs.com
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket: zhenxinjian
      custom-domain:

# JetCache 配置（穿透/击穿/雪崩/热点 key）
jetcache:
  statIntervalMinutes: 15
  areaInCacheName: false
  local:
    default:
      type: caffeine
      limit: 128
      keyConvertor: jackson
      expireAfterWriteInMillis: 300000
  remote:
    default:
      type: redis.lettuce
      # JetCache Lettuce 必须配置 uri，不会自动读取 spring.data.redis
      # 无密码: redis://127.0.0.1:6379/0
      # 有密码: redis://:密码@127.0.0.1:6379/0
      uri: ${JETCACHE_REDIS_URI:redis://127.0.0.1:6379/0}
      keyConvertor: jackson
      valueEncoder: java
      valueDecoder: java
      broadcastChannel: zhenxinjian-jetcache
      keyPrefix: "zhenxinjian:cache:"
      expireAfterWriteInMillis: 3600000
