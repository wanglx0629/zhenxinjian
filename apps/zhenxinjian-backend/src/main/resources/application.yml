# luote 后端主配置
# 作者: luote (luote) - https://luote996.cn

spring:
  application:
    name: zhenxinjian-backend
  profiles:
    active: dev
  banner:
    location: classpath:banner.txt
  jackson:
    deserialization:
      # 拒绝未知字段，防止 JSON 反序列化注入额外属性
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

# MyBatis-Plus 全局配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志默认关闭，开发环境在 application-dev.yml 打开

# SpringDoc Swagger 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# luote 自定义配置
zhenxinjian:
  jwt:
    secret: zhenxinjian-jwt-secret-key-change-in-production-luote996-cn
    expire-minutes: 120
    refresh-threshold-minutes: 30
  redis:
    token-prefix: "zhenxinjian:token:"
    captcha-prefix: "zhenxinjian:captcha:"
    login-fail-prefix: "zhenxinjian:login:fail:"
    # 登录试错上限（达到后锁定）
    login-fail-max: 10
    # 失败计数过期时间（分钟）
    login-fail-ttl-minutes: 15
  cache:
    warmup-enabled: true
    max-value-bytes: 51200
  websocket:
    # 是否启用 WebSocket Demo（false 时不注册端点）
    enabled: ${WS_ENABLED:true}
    # 握手路径（相对 server.servlet.context-path，完整 URL 形如 /api/ws/demo）
    path: ${WS_PATH:/ws/demo}
    # Sec-WebSocket-Protocol 子协议名，须与前端 new WebSocket(url, [protocol, jwt]) 一致
    protocol: ${WS_PROTOCOL:bearer}
    # 允许的 Origin；留空则复用 security.cors-allowed-origins（禁止配置 *）
    allowed-origins: []
    # 单条消息最大字节（同时限制容器文本/二进制缓冲）
    max-message-bytes: ${WS_MAX_MESSAGE_BYTES:4096}
    # 全局最大在线会话，0=不限制
    max-sessions: ${WS_MAX_SESSIONS:200}
    # 单用户最大并发连接
    max-sessions-per-user: ${WS_MAX_SESSIONS_PER_USER:3}
  security:
    permit-urls:
      - /auth/login
      - /auth/register
      - /auth/captcha
      - /ws/**
      # Swagger 文档（dev 基线开箱即通；生产禁用 springdoc 属后续运维 change）
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
    cors-allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
  storage:
    path-prefix: upload/
    max-size-mb: 10
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - pdf
    minio:
      # 默认关闭，本地未启动 MinIO 时不影响应用启动；需要上传时再开启
      enabled: false
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: zhenxinjian
    oss:
      enabled: false
      endpoint: oss-cn-hangzhou.aliyuncs.com
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket: zhenxinjian
      custom-domain:

# JetCache 配置（穿透/击穿/雪崩/热点 key）
jetcache:
  statIntervalMinutes: 15
  areaInCacheName: false
  local:
    default:
      type: caffeine
      limit: 128
      keyConvertor: jackson
      expireAfterWriteInMillis: 300000
  remote:
    default:
      type: redis.lettuce
      # JetCache Lettuce 必须配置 uri，不会自动读取 spring.data.redis
      # 无密码: redis://127.0.0.1:6379/0
      # 有密码: redis://:密码@127.0.0.1:6379/0
      uri: ${JETCACHE_REDIS_URI:redis://127.0.0.1:6379/0}
      keyConvertor: jackson
      valueEncoder: java
      valueDecoder: java
      broadcastChannel: zhenxinjian-jetcache
      keyPrefix: "zhenxinjian:cache:"
      expireAfterWriteInMillis: 3600000
